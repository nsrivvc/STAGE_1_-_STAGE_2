name: bronze-ingest

# Mirrors "GitHub Actions Workflow 1 (JSON Ingestion -> Bronze)" from the
# architecture diagram. Manual dispatch only.
#
# The hourly schedule is disabled: while the pipeline is still in development
# this fired against the live Neon database ~400 times and appended an
# ingestion_log row on every run. Re-enable the `schedule` block below once the
# workflow actually fetches fresh JSON from the NatGasHub API instead of
# re-ingesting a checked-in sample file.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Path to the NatGasHub JSON file to ingest"
        required: true
        default: "data/firms_test.json"
  # schedule:
  #   - cron: "0 * * * *"   # hourly; adjust to your posting cadence

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # In a real run, an earlier step would fetch the NatGasHub JSON from the
      # API and write it into data/ (using the API key secret). Here we ingest
      # whatever file the dispatch input points at.
      - name: Run Bronze ingestion
        env:
          DB_TYPE: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # Neon connection string
          SOURCE_SYSTEM: NatGasHub
          TRIGGERED_BY: github-actions
        run: |
          python -m src.main \
            --file "${{ github.event.inputs.file || 'data/firms_test.json' }}" \
            --create-tables

      # The ingestion step also exports each Bronze table to Parquet (under
      # parquet_output/) before loading the database. Publish those files as a
      # build artifact so they can be downloaded or handed to a later stage.
      - name: Upload Parquet export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-parquet-${{ github.run_id }}
          path: parquet_output/
          if-no-files-found: warn
